# Tiny Tapeout project information
project:
  title:        "8b_async_counter"      # Project title
  author:       "matthewychen"      # Your name
  discord:      "thvta"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "8b_async_counter for 298A"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     30       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_async_counter"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "async_counter.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "output-z-enable"
  ui[1]: "load value"
  ui[2]: "N/A"
  ui[3]: "N/A"
  ui[4]: "N/A"
  ui[5]: "N/A"
  ui[6]: "N/A"
  ui[7]: "N/A"

  # Outputs
  uo[0]: "N/A"
  uo[1]: "N/A"
  uo[2]: "N/A"
  uo[3]: "N/A"
  uo[4]: "N/A"
  uo[5]: "N/A"
  uo[6]: "N/A"
  uo[7]: "N/A"

  # Bidirectional pins
  uio[0]: "counter output 0, sync load in"
  uio[1]: "counter output 1, sync load in"
  uio[2]: "counter output 2, sync load in"
  uio[3]: "counter output 3, sync load in"
  uio[4]: "counter output 4, sync load in"
  uio[5]: "counter output 5, sync load in"
  uio[6]: "counter output 6, sync load in"
  uio[7]: "counter output 7, sync load in"

# Do not change!
yaml_version: 6
